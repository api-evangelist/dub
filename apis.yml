---
aid: dub
name: Dub
description: >-
  Dub is an open-source link attribution platform for creating short links,
  QR codes, and managing affiliate programs. It provides a REST API that allows
  developers to programmatically create and manage links, track conversion
  events (clicks, leads, and sales), retrieve analytics, and manage workspaces
  and custom domains. Dub powers over 100 million clicks and 2 million links
  monthly for marketing teams at companies like Vercel, Perplexity, Twilio,
  and Framer. The platform offers native SDKs in TypeScript, Python, Go, Ruby,
  and PHP, along with mobile SDKs for iOS and React Native.
