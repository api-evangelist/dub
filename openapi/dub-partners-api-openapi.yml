    get:
      operationId: listPartners
      x-speakeasy-name-override: list
      summary: List all partners
      description: List all partners for a partner program.
      tags:
      - Partners
      security:
      - token: []
      parameters:
      - in: query
        name: groupId
        schema:
          description: A filter on the list based on the partner's `groupId` field.
          example: grp_123
          type: string
        description: A filter on the list based on the partner's `groupId` field.
      - in: query
        name: status
        schema:
          description: A filter on the list based on the partner's `status` field.
          example: approved
          type: string
          enum:
          - pending
          - approved
          - rejected
          - invited
          - declined
          - deactivated
          - banned
          - archived
        description: A filter on the list based on the partner's `status` field.
      - in: query
        name: country
        schema:
          description: A filter on the list based on the partner's `country` field.
          example: US
          type: string
        description: A filter on the list based on the partner's `country` field.
      - in: query
        name: sortBy
        schema:
          default: totalSaleAmount
          description: The field to sort the partners by. The default is `totalSaleAmount`.
          example: totalSaleAmount
          type: string
          enum:
          - createdAt
          - totalClicks
          - totalLeads
          - totalConversions
          - totalSaleAmount
          - totalCommissions
          - netRevenue
          - earningsPerClick
          - averageLifetimeValue
          - clickToLeadRate
          - clickToConversionRate
          - leadToConversionRate
          - returnOnAdSpend
        description: The field to sort the partners by. The default is `totalSaleAmount`.
      - in: query
        name: sortOrder
        schema:
          default: desc
          description: The sort order. The default is `desc`.
          example: desc
          type: string
          enum:
          - asc
          - desc
        description: The sort order. The default is `desc`.
      - in: query
        name: email
        schema:
          description: Filter the partner list based on the partner's `email`. The value must be a string. Takes precedence over `search`.
          example: panic@thedis.co
          type: string
        description: Filter the partner list based on the partner's `email`. The value must be a string. Takes precedence over `search`.
      - in: query
        name: tenantId
        schema:
          description: Filter the partner list based on the partner's `tenantId`. The value must be a string. Takes precedence over `email` and `search`.
          example: 1K0NM7HCN944PEMZ3CQPH43H8
          type: string
        description: Filter the partner list based on the partner's `tenantId`. The value must be a string. Takes precedence over `email` and `search`.
      - in: query
        name: search
        schema:
          description: A search query to filter partners by ID, name, email, or link.
          example: john
          type: string
        description: A search query to filter partners by ID, name, email, or link.
      - in: query
        name: page
        schema:
          description: The page number for pagination.
          example: 1
          deprecated: false
          type: number
          minimum: 0
          exclusiveMinimum: true
