                    default: 0
                    type: number
                  netRevenue:
                    description: Net revenue after commissions (`Total Revenue - Total Commissions`)
                    default: 0
                    type: number
                  earningsPerClick:
                    description: Earnings Per Click (EPC) (`Total Revenue ÷ Total Clicks`)
                    nullable: true
                    type: number
                  averageLifetimeValue:
