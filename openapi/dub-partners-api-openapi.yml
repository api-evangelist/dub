                    nullable: true
                    type: number
                  leadToConversionRate:
                    description: Percentage of leads that convert to paying customers (`Total Conversions ÷ Total Leads`)
                    nullable: true
                    type: number
                  returnOnAdSpend:
                    description: Return On Ad Spend (ROAS) (`Total Revenue ÷ Total Commissions`)
                    nullable: true
                    type: number
                  website:
