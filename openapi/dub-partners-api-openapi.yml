                    additionalProperties: false
                  application:
                    description: Linked program application, including review outcome when applicable.
                    nullable: true
                    type: object
                    properties:
                      rejectionReason:
                        nullable: true
                        description: Preset reason when the application was rejected.
                        type: string
                        enum:
                        - needsMoreDetail
                        - doesNotMeetRequirements
                        - notTheRightFit
                        - other
                      rejectionNote:
                        nullable: true
                        description: Free-form note when the application was rejected.
                        type: string
                      reviewedAt:
                        nullable: true
                        description: When the application was approved or rejected.
                        type: string
                    required:
                    - rejectionReason
                    - rejectionNote
                    - reviewedAt
                    additionalProperties: false
                  tags:
                    description: The tags associated with the partner.
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                      required:
                      - id
                      - name
                      additionalProperties: false
                  totalClicks:
                    default: 0
                    description: The total number of clicks on the partner's links
                    type: number
                  totalLeads:
                    default: 0
                    description: The total number of leads generated by the partner's links
                    type: number
                  totalConversions:
                    default: 0
                    description: The total number of leads that converted to paying customers
                    type: number
                  totalSales:
